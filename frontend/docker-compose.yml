services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in frontend/.env}
    image: frontend-frontend:latest
    container_name: omnichannel-frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: ${NODE_ENV:?Set NODE_ENV in frontend/.env}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in frontend/.env}
      PORT: 3000
    networks:
      - omnichannel-network

  nginx:
    image: nginx:1.30.5-alpine3.24
    container_name: omnichannel-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_BIND_ADDRESS:?Set NGINX_BIND_ADDRESS in frontend/.env}:${NGINX_PORT:?Set NGINX_PORT in frontend/.env}:80"
    environment:
      NGINX_API_UPSTREAM: ${NGINX_API_UPSTREAM:?Set NGINX_API_UPSTREAM in frontend/.env}
      NGINX_FRONTEND_UPSTREAM: ${NGINX_FRONTEND_UPSTREAM:?Set NGINX_FRONTEND_UPSTREAM in frontend/.env}
      NGINX_PROXY_READ_TIMEOUT: ${NGINX_PROXY_READ_TIMEOUT:?Set NGINX_PROXY_READ_TIMEOUT in frontend/.env}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:?Set NGINX_CLIENT_MAX_BODY_SIZE in frontend/.env}
      NGINX_ENVSUBST_FILTER: '^NGINX_(API_UPSTREAM|FRONTEND_UPSTREAM|PROXY_READ_TIMEOUT|CLIENT_MAX_BODY_SIZE)$'
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - frontend
    networks:
      - omnichannel-network

networks:
  omnichannel-network:
    name: ${DOCKER_NETWORK:?Set DOCKER_NETWORK in frontend/.env}
    external: true
