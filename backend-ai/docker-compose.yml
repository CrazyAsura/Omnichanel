services:
  backend-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnichannel-backend-ai
    restart: unless-stopped
    expose:
      - "8000"
      - "50051"
    environment:
      HTTP_PORT: 8000
      GRPC_PORT: 50051
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:?Set OLLAMA_BASE_URL in backend-ai/.env}
      OLLAMA_MODEL: ${OLLAMA_MODEL:?Set OLLAMA_MODEL in backend-ai/.env}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?Set KAFKA_BOOTSTRAP_SERVERS in backend-ai/.env}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:?Set ELASTICSEARCH_URL in backend-ai/.env}
      AI_EVENTS_TOPIC: ${AI_EVENTS_TOPIC:?Set AI_EVENTS_TOPIC in backend-ai/.env}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set AI_SERVICE_TOKEN in backend-ai/.env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in backend-ai/.env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - omnichannel-network

networks:
  omnichannel-network:
    name: ${DOCKER_NETWORK:?Set DOCKER_NETWORK in backend-ai/.env}
    external: true
